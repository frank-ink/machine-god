name: CI Gate Enforcement

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  capability-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run capability gate validator
        run: python zero/capability_gate.py --check docs/zero/capabilities.md
