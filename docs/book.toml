[book]
title = "Machine God"
authors = ["Simon Peter Rothgang"]
description = "User and contributor documentation for Machine God."
language = "en"
src = "src"

[build]
build-dir = "book"
create-missing = false

[output.html]
git-repository-url = "https://github.com/gschaidergabriel/machine-god"
edit-url-template = "https://github.com/gschaidergabriel/machine-god/edit/main/docs/{path}"
site-url = "/machine-god/"
default-theme = "rust"
preferred-dark-theme = "ayu"
no-section-label = true
