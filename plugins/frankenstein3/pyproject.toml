[project]
name = "frankenstein3"
version = "3.0.0"
description = "FranKenstein 3.0 - Portable plugin for Machine God"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "*/__pycache__/*"]
