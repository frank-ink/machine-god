[pytest]
testpaths = tests

Notes:
- `docs/zero/contract_env.test.py` is retired: it is renamed/moved to `plugins/frankenstein3/tests/test_contract_env.py`. Remove the old path to avoid duplicate/ stale tests.
- The validator is stdlib-only (`json`, `re`, `pathlib`, `importlib`); it exercises `additionalProperties: false`, `const`, `pattern`, `minItems`/`maxItems`, and `uniqueItems` against mutated in-memory copies (no files are modified).
- The precedence test imports `plugins/frankenstein3/scripts/star/f3_pfade.py` by path, calls the real `get_data_dir()`, and reads the precedence order from the resolver module (no hardcoded literal).
- File is named `test_*.py` and lives under `tests/` with `testpaths = tests`, so pytest collects it automatically.
